<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GCVH — Create Account</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --primary: #0d5a3f;
      --primary-hover: #0f7a57;
      --bg: #f5fbf8;
      --card-bg: #ffffff;
      --text: #0d5a3f;
      --text-muted: #597368;
      --border: rgba(13, 90, 63, 0.12);
      --input-bg: #f8fdfb;
      --gold: #d4af37;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      width: min(480px, 100%);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 30px;
      box-shadow: 0 30px 80px rgba(13, 90, 63, 0.08);
    }
    .logo {
      width: 52px;
      height: 52px;
      border: 1px solid rgba(13, 90, 63, 0.25);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--primary);
      font: 28px Georgia, serif;
      margin: 0 auto 14px;
      background: rgba(13, 90, 63, 0.03);
    }
    .title {
      text-align: center;
      font: 700 28px Georgia, serif;
      margin: 0;
      color: var(--primary);
    }
    .sub {
      text-align: center;
      color: var(--primary-hover);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 8px 0 24px;
    }
    .field {
      margin-bottom: 16px;
    }
    .password-input-wrap {
      position: relative;
    }
    .password-input-wrap input {
      padding-right: 52px;
    }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }
    .password-toggle:hover {
      color: var(--primary);
      background: rgba(13, 90, 63, 0.06);
    }
    .password-toggle:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .password-toggle svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .password-toggle .icon-eye-off,
    .password-toggle.is-visible .icon-eye {
      display: none;
    }
    .password-toggle.is-visible .icon-eye-off {
      display: block;
    }
    .field label {
      display: block;
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      background: var(--input-bg);
      border: 1px solid rgba(13, 90, 63, 0.18);
      border-radius: 10px;
      color: var(--primary);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13, 90, 63, 0.1);
    }
    .button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #0f7a57, #0d5a3f);
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.15s, opacity 0.15s;
    }
    .button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .alert {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.5;
    }
    .alert.show {
      display: block;
    }
    .alert.error {
      background: #fdf2f2;
      border: 1px solid rgba(220, 38, 38, 0.2);
      color: #b91c1c;
    }
    .alert.success {
      background: #edfdf5;
      border: 1px solid rgba(13, 90, 63, 0.2);
      color: #0d5a3f;
    }
    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .links a {
      color: var(--primary-hover);
      font-weight: 700;
      text-decoration: none;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .home-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
    }
    .home-link:hover {
      color: var(--primary);
    }
    .footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 20px;
      line-height: 1.6;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">✦</div>
    <h1 class="title">Create Your Account</h1>
    <div class="sub">Global Capital Venture Holdings</div>

    <div id="referralBanner" style="display:none;background:rgba(13,90,63,0.08);border:1.5px solid rgba(13,90,63,0.25);border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:13px;color:#0d5a3f;font-weight:700;align-items:center;gap:10px;">
      <span style="font-size:16px;">✦</span>
      <div>
        <span style="display:block;font-size:11px;color:#597368;text-transform:uppercase;letter-spacing:0.08em;">Invited by Partner</span>
        <span style="font-weight:800;color:#0f7a57;" id="refPartnerCode">GCVH-INVITE</span>
      </div>
    </div>

    <div id="alert" class="alert"></div>

    <div class="field">
      <label for="fullName">Full Name</label>
      <input id="fullName" type="text" autocomplete="name" placeholder="John Doe" required>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
    </div>

    <div class="field">
      <label for="phone">Mobile Number</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+1 555 123 4567" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-input-wrap">
        <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
        <button id="passwordToggle" class="password-toggle" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false">
          <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A11.8 11.8 0 0 1 12 5c6.4 0 10 7 10 7a15.4 15.4 0 0 1-3.1 3.9M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7c1 0 1.9-.2 2.8-.5"></path></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="referralCode">Referral Code <span style="color:var(--text-muted);font-weight:normal">(optional)</span></label>
      <input id="referralCode" type="text" autocomplete="off" placeholder="GCVH-XXXXX">
    </div>

    <button id="create" class="button" type="button">Create Account</button>

    <div class="links">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
    <a href="index.html" class="home-link">← Back to Homepage</a>

    <div class="footer">
      Three-level referral simulation: Level 1 = 10%, Level 2 = 5%, Level 3 = 3%. Direct referral volume contributes toward monthly salary milestones.
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');

    passwordToggle.addEventListener('click', () => {
      const isVisible = passwordInput.type === 'password';
      passwordInput.type = isVisible ? 'text' : 'password';
      passwordToggle.classList.toggle('is-visible', isVisible);
      passwordToggle.setAttribute('aria-label', isVisible ? 'Hide password' : 'Show password');
      passwordToggle.setAttribute('aria-pressed', String(isVisible));
    });

    const qs = new URLSearchParams(location.search);
    let ref = qs.get('ref') || qs.get('referral') || qs.get('code') || qs.get('r');
    if (ref) {
      ref = ref.trim().toUpperCase();
      sessionStorage.setItem('gcvh_ref_partner', ref);
    } else {
      ref = sessionStorage.getItem('gcvh_ref_partner') || '';
    }

    if (ref) {
      const codeInput = document.getElementById('referralCode');
      const banner = document.getElementById('referralBanner');
      const partnerCode = document.getElementById('refPartnerCode');
      if (codeInput) codeInput.value = ref;
      if (banner && partnerCode) {
        partnerCode.textContent = ref;
        banner.style.display = 'flex';
      }
    }

    function alertBox(text, ok) {
      const el = document.getElementById('alert');
      el.textContent = text;
      el.className = 'alert show ' + (ok ? 'success' : 'error');
    }

    document.getElementById('create').onclick = async () => {
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const referralCode = document.getElementById('referralCode').value.trim();

      if (!fullName || !email || !phone || password.length < 8) {
        alertBox('Please provide your name, email, mobile number, and a password of at least 8 characters.', false);
        return;
      }
      if (!/^\+?[\d\s().-]{7,20}$/.test(phone) || phone.replace(/\D/g, '').length < 7 || phone.replace(/\D/g, '').length > 15) {
        alertBox('Please enter a valid mobile number with 7 to 15 digits, including country code.', false);
        return;
      }

      const createButton = document.getElementById('create');
      try {
        createButton.disabled = true;
        createButton.textContent = 'Creating Account...';

        const res = await fetch(API + '/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fullName,
            email,
            phone,
            password,
            referralCode: referralCode || undefined
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Registration failed.');
        }

        // If registered successfully, clear stored session ref
        sessionStorage.removeItem('gcvh_ref_partner');

        alertBox('Account created successfully! Redirecting you to sign in...', true);
        setTimeout(() => {
          window.location.href = 'login.html?registered=1&email=' + encodeURIComponent(email);
        }, 1200);

      } catch (err) {
        createButton.disabled = false;
        createButton.textContent = 'Create Account';
        alertBox(err.message || 'Registration failed.', false);
      }
    };
  </script>
</body>
</html>
