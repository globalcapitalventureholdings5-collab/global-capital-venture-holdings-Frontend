<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GCVH — Sign In</title><style>body{margin:0;background:#070a0d;color:#f4f6f8;font-family:Inter,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(410px,92vw);background:#10171e;border:1px solid #2b3540;border-radius:18px;padding:30px;box-shadow:0 30px 80px #000}.logo{width:50px;height:50px;border:1px solid #d5ad5a80;border-radius:50%;display:grid;place-items:center;color:#f1d48b;font:28px Georgia,serif;margin:0 auto 14px}.title{text-align:center;font:700 27px Georgia,serif;margin:0}.sub{text-align:center;color:#d5ad5a;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin:8px 0 25px}.field{margin-bottom:15px}.field label{display:block;color:#9ba6ae;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}.field input{width:100%;height:46px;box-sizing:border-box;padding:0 13px;background:#070a0d;border:1px solid #222c35;border-radius:9px;color:#fff;outline:none}.button{width:100%;height:46px;border:0;border-radius:9px;background:linear-gradient(135deg,#f1d48b,#b98d3e);font-weight:900;color:#171209;cursor:pointer}.alert{display:none;padding:11px;border-radius:9px;margin-bottom:15px;font-size:12px}.alert.show{display:block;background:#ff647f12;border:1px solid #ff647f35;color:#ff9aae}.links{text-align:center;margin-top:15px;font-size:12px}.links a{color:#f1d48b}</style></head><body><div class="card"><div class="logo">G</div><h1 class="title">Customer Sign In</h1><div class="sub">Global Capital Venture Holdings</div><div id="alert" class="alert"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="login" class="button" type="button">Sign In</button><div class="links">New customer? <a href="register.html">Create an account</a></div></div><script>
const API='https://global-capital-venture-holdings-backend-production.up.railway.app';
const e=document.getElementById('alert');
const button=document.getElementById('login');
function err(t){e.textContent=t;e.className='alert show'}
button.onclick=async()=>{
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  if(!email||!password){err('Please enter your email and password.');return;}
  button.disabled=true;button.textContent='Signing in...';
  try{
    const r=await fetch(API+'/api/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password})
    });
    let d={};
    try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d.error||('Login failed ('+r.status+').'));
    if(!d.token)throw new Error('Login succeeded but no session token was returned.');
    localStorage.setItem('gcvh_customer_token',d.token);
    localStorage.setItem('gcvh_customer_user',JSON.stringify(d.user||{}));
    const params=new URLSearchParams(location.search);
    const redirect=params.get('redirect');
    location.href=(redirect&&redirect.startsWith('deposit.html'))?redirect:'dashboard.html';
  }catch(x){
    err(x.name==='TypeError'?'Unable to connect to the account server. Please try again.':x.message);
    button.disabled=false;button.textContent='Sign In';
  }
};
</script></body></html>
